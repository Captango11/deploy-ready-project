services:
  - type: web
    name: career-match-ai
    runtime: python
    plan: free
    rootDir: career-match-ai
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
